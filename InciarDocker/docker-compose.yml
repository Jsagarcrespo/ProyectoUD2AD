
name: proyectoud2

services:
  mariadb:
    image: mariadb:11.4
    container_name: juegos_mariadb

    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: asociacion_juegos
      MARIADB_USER: juegos_user
      MARIADB_PASSWORD: juegos123

    ports:
      - "3306:3306"

    volumes:
      - datos_juegos:/var/lib/mysql
      - ./asociacion_juegos.sql:/docker-entrypoint-initdb.d/01-asociacion_juegos.sql:ro

volumes:
  datos_juegos:
